name: SecurityCodeScan

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.cs"
      - "tests/**/*.cs"
      - ".github/workflows/securitycodescan.yml"
      - ".github/workflows/core-ci.yml"
      - "global.json"
  pull_request:
    branches: [main, feature/core-lifecycle-resolution]
    paths:
      - "src/**/*.cs"
      - "tests/**/*.cs"
      - ".github/workflows/securitycodescan.yml"
      - ".github/workflows/core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-code-scan:
    name: Static analysis for C# source
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json

      - name: Add SecurityCodeScan analyzer
        uses: security-code-scan/security-code-scan-add-action@f8ff4f2763ed6f229eded80b1f9af82ae7f32a0d

      - name: Restore Core test project
        run: dotnet restore tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj

      - name: Build Core test project with analyzers
        run: dotnet build tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj --configuration Release --no-restore

      - name: Preserve and summarize native SecurityCodeScan SARIF
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path(".").rglob("analysis.sarif"))
          if not reports:
              raise SystemExit("SecurityCodeScan emitted no analysis.sarif report.")

          output = Path("artifacts/securitycodescan")
          output.mkdir(parents=True, exist_ok=True)

          for index, report in enumerate(reports):
              payload = json.loads(report.read_text(encoding="utf-8-sig"))
              if payload.get("version") != "1.0.0" or not isinstance(payload.get("runs"), list):
                  raise SystemExit(f"Unexpected native SecurityCodeScan SARIF format: {report}")

              result_count = sum(len(run.get("results", [])) for run in payload["runs"])
              print(f"{report}: SARIF {payload['version']}; runs={len(payload['runs'])}; findings={result_count}")

              safe_name = report.parent.name.replace("/", "_").replace("\\", "_") or "root"
              destination = output / f"{index}-{safe_name}.sarif"
              destination.write_text(report.read_text(encoding="utf-8-sig"), encoding="utf-8")

          print(f"Preserved {len(reports)} native SecurityCodeScan SARIF report(s).")
          PY

      - name: Upload native SecurityCodeScan SARIF artifact
        if: always() && hashFiles('artifacts/securitycodescan/*.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: securitycodescan-sarif
          path: artifacts/securitycodescan/*.sarif
          if-no-files-found: error
