name: SecurityCodeScan

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.cs"
      - "tests/**/*.cs"
      - ".github/workflows/securitycodescan.yml"
      - ".github/workflows/core-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.cs"
      - "tests/**/*.cs"
      - ".github/workflows/securitycodescan.yml"
      - ".github/workflows/core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-code-scan:
    name: Static analysis for C# source
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add SecurityCodeScan analyzer
        uses: security-code-scan/security-code-scan-add-action@f8ff4f2763ed6f229eded80b1f9af82ae7f32a0d

      - name: Restore Core test project
        run: dotnet restore tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj

      - name: Build Core test project with analyzers
        run: dotnet build tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj --configuration Release --no-restore

      - name: Combine analyzer SARIF reports
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path(".").rglob("analysis.sarif"))
          if not reports:
              print("No SARIF report was emitted by SecurityCodeScan.")
              raise SystemExit(0)

          merged = {"version": "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json", "runs": []}
          for report in reports:
              payload = json.loads(report.read_text(encoding="utf-8-sig"))
              if payload.get("version") != "2.1.0" or not isinstance(payload.get("runs"), list):
                  raise SystemExit(f"Invalid SARIF 2.1.0 report: {report}")
              merged["runs"].extend(payload["runs"])

          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/securitycodescan.sarif").write_text(
              json.dumps(merged, ensure_ascii=False),
              encoding="utf-8"
          )
          print(f"Combined {len(reports)} SARIF report(s) into artifacts/securitycodescan.sarif")
          PY

      - name: Upload SARIF
        if: always() && hashFiles('artifacts/securitycodescan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/securitycodescan.sarif
