name: CodeQL Advanced

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.cs"
      - "tests/**/*.cs"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.cs"
      - "tests/**/*.cs"
      - ".github/workflows/**"
  schedule:
    - cron: "24 14 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
