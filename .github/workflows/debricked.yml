name: Optional Debricked Dependency Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities-scan:
    name: Scan restored project dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Debricked credentials
        shell: bash
        env:
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
        run: |
          test -n "$DEBRICKED_TOKEN" || { echo "::error::Missing DEBRICKED_TOKEN repository secret."; exit 1; }

      - name: Run Debricked
        uses: debricked/actions@v4
        env:
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
