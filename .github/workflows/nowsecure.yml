name: Optional NowSecure Mobile Assessment

on:
  workflow_dispatch:
    inputs:
      app_file:
        description: "Path to an already-built APK or IPA in the checked-out repository"
        required: true
        type: string
      group_id:
        description: "NowSecure Platform group ID"
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  nowsecure:
    name: Scan supplied mobile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate artifact and account configuration
        shell: bash
        env:
          NS_TOKEN: ${{ secrets.NS_TOKEN }}
          APP_FILE: ${{ inputs.app_file }}
          GROUP_ID: ${{ inputs.group_id }}
        run: |
          test -n "$NS_TOKEN" || { echo "::error::Missing NS_TOKEN repository secret; NowSecure account access is required."; exit 1; }
          test -n "$GROUP_ID" || { echo "::error::group_id input is required."; exit 1; }
          test -f "$APP_FILE" || { echo "::error::Mobile artifact not found: $APP_FILE"; exit 1; }

      - name: Run NowSecure
        uses: nowsecure/nowsecure-action@3b439db31b6dce857b09f5222fd13ffc3159ad26
        with:
          token: ${{ secrets.NS_TOKEN }}
          app_file: ${{ inputs.app_file }}
          group_id: ${{ inputs.group_id }}

      - name: Upload SARIF
        if: always() && hashFiles('NowSecure.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: NowSecure.sarif
