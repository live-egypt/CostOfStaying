name: Core CI

# CI policy revision: 2026-11-01

on:
  push:
    branches:
      - main
      - feature/core-lifecycle-resolution
    paths:
      - "src/CostOfStaying.Core/**"
      - "tests/CostOfStaying.Core.Tests/**"
      - ".github/workflows/**"
      - "global.json"
  pull_request:
    branches:
      - main
      - feature/core-lifecycle-resolution
    paths:
      - "src/CostOfStaying.Core/**"
      - "tests/CostOfStaying.Core.Tests/**"
      - ".github/workflows/**"
      - "global.json"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Build and test standalone Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce Core dependency boundary
        shell: bash
        run: |
          if grep -R -n -E 'using (UnityEngine|FishNet)(\.|;)|UnityEngine\.|FishNet\.' src/CostOfStaying.Core --include='*.cs' --include='*.csproj'; then
            echo "::error::Core must not reference UnityEngine or FishNet."
            exit 1
          fi

      - name: Enforce Core composition root
        shell: bash
        run: |
          aggregate_violations="$(grep -R -n -E 'new (BetrayalLedger|MatchLifecycle|VitalityAccount|SessionLifecycle|SessionRegistry|MatchPlayerRegistry|CommandAdmissionQueue|CommandAdmissionService|SessionCleanupService|MatchRosterSnapshotBuilder)(\(|<)' src/CostOfStaying.Core --include='*.cs' | grep -v 'CoreComposition.cs:' || true)"
          tracker_violations="$(grep -R -n -E 'new CommandSequenceTracker\(' src/CostOfStaying.Core --include='*.cs' | grep -v 'CommandAdmissionQueue.cs:' || true)"
          cleanup_violations="$(grep -R -n -E '(ResetSession|RemoveClosedSession)\(' src/CostOfStaying.Core --include='*.cs' | grep -v -E '(SessionCleanupService|CommandAdmissionQueue|SessionRegistry)\.cs:' || true)"
          queue_access_violations="$(grep -R -n -E '\.Try(Enqueue|Dequeue)\(' src/CostOfStaying.Core --include='*.cs' | grep -v 'CommandAdmissionService.cs:' || true)"
          snapshot_violations="$(grep -R -n -E 'new (MatchRosterSnapshot|PlayerStateSnapshot)\(' src/CostOfStaying.Core --include='*.cs' | grep -v 'MatchRosterSnapshotBuilder.cs:' || true)"
          if [ -n "$aggregate_violations$tracker_violations$cleanup_violations$queue_access_violations$snapshot_violations" ]; then
            printf '%s\n%s\n%s\n%s\n%s\n' "$aggregate_violations" "$tracker_violations" "$cleanup_violations" "$queue_access_violations" "$snapshot_violations"
            echo "::error::Core construction must be centralized in CoreComposition; command queue access, session cleanup and snapshot construction must use their designated services."
            exit 1
          fi

      - name: Prepare artifact directories
        run: mkdir -p artifacts/test-results artifacts/build-logs

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj --verbosity minimal

      - name: Build Core (Release)
        run: dotnet build src/CostOfStaying.Core/CostOfStaying.Core.csproj --configuration Release --no-restore -bl:"$GITHUB_WORKSPACE/artifacts/build-logs/core.binlog"

      - name: Build tests (Release)
        run: dotnet build tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj --configuration Release --no-restore -bl:"$GITHUB_WORKSPACE/artifacts/build-logs/tests.binlog"

      - name: Run NUnit tests (Release)
        run: dotnet test tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=core-tests.trx" --results-directory "$GITHUB_WORKSPACE/artifacts/test-results"

      - name: Verify TRX report exists
        run: test -s "$GITHUB_WORKSPACE/artifacts/test-results/core-tests.trx"

      - name: Upload build logs and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-ci-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
