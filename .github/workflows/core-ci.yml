name: Core CI

# CI policy revision: 2026-11-01

on:
  push:
    branches:
      - main
      - feature/core-lifecycle-resolution
    paths:
      - "src/CostOfStaying.Core/**"
      - "tests/CostOfStaying.Core.Tests/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/CostOfStaying.Core/**"
      - "tests/CostOfStaying.Core.Tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Build and test standalone Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Core dependency boundary
        shell: bash
        run: |
          if grep -R -n -E 'using (UnityEngine|FishNet)(\.|;)|UnityEngine\.|FishNet\.' src/CostOfStaying.Core --include='*.cs' --include='*.csproj'; then
            echo "::error::Core must not reference UnityEngine or FishNet."
            exit 1
          fi

      - name: Enforce Core composition root
        shell: bash
        run: |
          aggregate_violations="$(grep -R -n -E 'new (BetrayalLedger|MatchLifecycle|VitalityAccount|CommandAdmissionQueue)(\\(|<)' src/CostOfStaying.Core --include='*.cs' | grep -v 'CoreComposition.cs:' || true)"
          tracker_violations="$(grep -R -n -E 'new CommandSequenceTracker\\(' src/CostOfStaying.Core --include='*.cs' | grep -v -E '(CoreComposition|CommandAdmissionQueue)\\.cs:' || true)"
          if [ -n "$aggregate_violations$tracker_violations" ]; then
            printf '%s\n%s\n' "$aggregate_violations" "$tracker_violations"
            echo "::error::Core service and aggregate construction must be centralized in CoreComposition; the queue may own its private sequence tracker."
            exit 1
          fi

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj

      - name: Restore
        run: dotnet restore tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj

      - name: Build Core
        run: dotnet build src/CostOfStaying.Core/CostOfStaying.Core.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj --configuration Release --no-restore

      - name: Run NUnit tests
        run: dotnet test tests/CostOfStaying.Core.Tests/CostOfStaying.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=core-tests.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
