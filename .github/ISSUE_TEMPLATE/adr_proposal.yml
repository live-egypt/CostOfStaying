name: "📜 ADR proposal"
description: "Request a new Architectural Decision Record"
title: "[ADR] "
labels: ["adr"]
body:
  - type: input
    id: adr-id
    attributes:
      label: "Proposed ADR ID"
      placeholder: "ADR-006-SOMETHING"
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: "Context"
    validations: { required: true }
  - type: textarea
    id: decision
    attributes:
      label: "Proposed decision"
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives & risks"
  - type: textarea
    id: verification
    attributes:
      label: "How to verify"
      description: "Tests, CI checks, Playtest gates"
