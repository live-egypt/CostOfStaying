name: "🐛 Bug report"
description: "Report a reproducible bug in Domain Core, tools, or docs"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "Steps, expected vs actual"
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: "Reproduction"
      description: "Commit SHA, preset, seed, command"
      placeholder: "commit: 0ed82f4\npython3 tools/balance_simulator/simulate.py --preset default --seed 42"
  - type: textarea
    id: impact
    attributes:
      label: "Impact / rule violated"
      description: "Which RULE/ADR is affected?"
  - type: checkboxes
    id: checks
    attributes:
      label: "Checks"
      options:
        - label: "I ran `python3 tools/audit.py` and it passes"
        - label: "No secrets included"
